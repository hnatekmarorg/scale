apiVersion: v1
kind: Service
metadata:
  name: {{ include "scale-backend.fullname" . }}
  labels:
    {{- include "scale-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scale-backend.fullname" . }}-frontend
  labels:
    {{- include "scale-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: frontend
