# Default values for scale-backend chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# The estate's registry (the old gitea host is dead). The org is private, so pulls need the
# `imagePullSecrets` below (an ESO-managed `forgejo-registry` in the release namespace).
image:
  repository: forgejo.dev-k8s.srv.hnatekmar.dev/hnatekmarorg/scale
  tag: be
  pullPolicy: IfNotPresent

frontendImage:
  repository: forgejo.dev-k8s.srv.hnatekmar.dev/hnatekmarorg/scale
  tag: fe
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: scale.hnatekmar.dev
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
  tls: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# ServiceAccount configuration
serviceAccount:
  create: true
  name: ""

# RBAC configuration
rbac:
  create: true
  # The namespace whose Deployments the dashboard may list and toggle. Defaults to the release
  # namespace; set it when the models live elsewhere (SCALE in `scale`, models in `inference`).
  namespace: ""
