name: Build Image using Containerfile
on:
  push:
    paths:
      - fe/**
      - be/**

jobs:
  build:
    name: Build image
    runs-on: dind
    steps:
    - uses: actions/checkout@v4.2.2
    - name: remove all docker images
      run: docker rmi $(docker image ls -aq) --force || true
    - uses: docker/login-action@v3
      with:
        registry: gitea.hnatekmar.xyz
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - run: |
        cd docker
        docker system prune --all
        docker build fe/ -t gitea.hnatekmar.xyz/public/scale:fe
        docker build be/ -t gitea.hnatekmar.xyz/public/scale:be
        docker push --all-tags gitea.hnatekmar.xyz/public/scale

