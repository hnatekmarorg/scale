# Default values for scale-backend chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: gitea.hnatekmar.xyz/public/scale
  tag: be
  pullPolicy: Always

frontendImage:
  repository: gitea.hnatekmar.xyz/public/scale
  tag: fe
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
  enabled: true
  className: nginx
  hosts:
    - host: scale.hnatekmar.dev
      paths:
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix
  tls:
    - hosts:
      - scale.hnatekmar.dev
      secretName: scale-secret

resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# ServiceAccount configuration
serviceAccount:
  create: true
  name: ""

  # RBAC configuration
rbac:
  create: true
